<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Voice Chat</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap">
  <style>
    :root {
      /* Colors for a serious and neat look */
      --primary: #2c3e50;               /* Deep slate */
      --secondary: #e0e0e0;             /* Light gray */
      --bubble-user: #2c3e50;           /* User message bubble */
      --bubble-user-text: #ffffff;      /* White text for user bubble */
      --bubble-assistant: #dcdcdc;      /* Assistant message bubble */
      --bubble-assistant-text: #333333; /* Dark gray text for assistant bubble */
      --bg: #f4f4f4;                    /* Very light gray page background */
      --shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(
        90deg,
        #FFD84A 0%,
        #D9A97C 50%,
        #B98AEF 100%
      );
      background-size: cover;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }
    .chat-container {
      flex: 1;
      max-width: 480px;
      width: 100%;
      background: #fff;
      box-shadow: var(--shadow);
      margin: 24px 0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: var(--primary);
      color: #fff;
      padding: 18px 24px;
      font-size: 1.25rem;
      letter-spacing: 1px;
      font-weight: 500;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      font-size: 0.9rem;
      color: #c0c0c0;
      margin-left: 12px;
    }
    .character-select {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.9rem;
      font-weight: 500;
      appearance: none;
      cursor: pointer;
      min-width: 160px;
    }
    .character-select option {
      color: #222;
      background: #fff;
    }
    .character-pill {
      margin-left: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .messages {
      flex: 1;
      padding: 20px 16px 16px 16px;
      overflow-y: auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 82%;
      font-size: 1.02rem;
      line-height: 1.6;
      position: relative;
      display: inline-block;
      word-break: break-word;
      box-shadow: 0 0.5px 2px rgba(44,62,80,0.1);
    }
    .bubble.user {
      background: var(--bubble-user);
      color: var(--bubble-user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      margin-left: auto;
    }
    .bubble.assistant {
      background: var(--bubble-assistant);
      color: var(--bubble-assistant-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      margin-right: auto;
    }
    /* Updated typing bubble to a simpler, lighter color */
    .bubble.typing {
      background: #ebedef;
      color: #444;
      font-style: italic;
      opacity: 0.9;
      animation: pulsebg 1.3s linear infinite;
      min-width: 60px;
      border-radius: 16px;
    }
    @keyframes pulsebg {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
    .input-bar {
      display: flex;
      padding: 12px 12px;
      background: #fff;
      border-top: 1px solid #e1e5ef;
      align-items: center;
      gap: 8px;
    }
    .input-bar button {
      appearance: none;
      outline: none;
      border: none;
      padding: 8px 18px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
      margin-left: 4px;
    }
    .input-bar button:active {
      background: #203a4a;
    }
    .input-bar button:disabled {
      background: #a0a0a0;
      cursor: default;
    }
    @media (max-width: 600px) {
      .chat-container {
        margin: 0;
        border-radius: 0;
        max-width: 100vw;
      }
      .header {
        border-radius: 0;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-weight: 500;
      font-size: 16px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
    }

    .btn svg {
      margin: 0;
    }

    .start-btn {
      background-color: #2a3543;
    }

    .stop-btn {
      background-color: #c04949;
    }

    .reset-btn {
      background-color: #0d65d0;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }    
    .speed-control {
      flex: 1;
      margin: 0 16px;
      max-width: 200px;
    }
    #speedSlider {
      width: 100%;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    #speedSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #2c3e50;
      border-radius: 50%;
      cursor: pointer;
    }
    .speed-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 0.8rem;
      color: #666;
    }
    /* Injection Panel Styles */
    .inject-panel {
      display: flex;
      padding: 12px;
      background: #f8f9fa;
      border-top: 1px solid #e1e5ef;
      gap: 8px;
      align-items: center;
    }
    #injectInput {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    #injectInput:focus {
      border-color: #9b59b6;
      box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.1);
    }
    #injectInput::placeholder {
      color: #999;
    }
    .inject-btn {
      background: linear-gradient(135deg, #9b59b6, #8e44ad) !important;
      gap: 6px;
    }
    .inject-btn:hover {
      background: linear-gradient(135deg, #8e44ad, #7d3c98) !important;
    }
    /* Injection bubble style */
    .bubble.injection {
      background: linear-gradient(135deg, #f3e5f5, #e1bee7);
      color: #6a1b9a;
      align-self: center;
      border-radius: 12px;
      font-size: 0.9rem;
      padding: 8px 14px;
      max-width: 90%;
      border: 1px dashed #ba68c8;
      font-style: italic;
    }
    .bubble.injection::before {
      content: "💉 ";
    }
    
    /* Game Manager Panel Styles */
    .gm-panel {
      width: 320px;
      background: #1a1a2e;
      border-radius: 16px;
      margin: 24px 0 24px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
    }
    .gm-header {
      background: linear-gradient(135deg, #16213e, #1a1a2e);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2d2d44;
    }
    .gm-icon {
      font-size: 1.4rem;
    }
    .gm-title {
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }
    .gm-status {
      margin-left: auto;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
    }
    .gm-status.active {
      color: #4ade80;
    }
    .gm-status.disabled {
      color: #f87171;
    }
    .gm-status.processing {
      color: #fbbf24;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .gm-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .gm-timer-section {
      background: linear-gradient(135deg, #2d2d44, #1a1a2e);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .gm-timer-label {
      color: #888;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .gm-timer {
      color: #fff;
      font-size: 2.5rem;
      font-weight: 700;
      font-family: 'SF Mono', 'Consolas', monospace;
    }
    .gm-trigger-btn {
      margin-top: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: transform 0.1s, opacity 0.2s;
    }
    .gm-trigger-btn:hover {
      opacity: 0.9;
    }
    .gm-trigger-btn:active {
      transform: scale(0.97);
    }
    .gm-inject-section {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px;
      border: 1px dashed rgba(99, 102, 241, 0.3);
    }
    .gm-inject-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .gm-inject-input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 8px 10px;
      color: #fff;
      font-size: 0.85rem;
    }
    .gm-inject-input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .gm-inject-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .gm-inject-btn:hover {
      opacity: 0.9;
    }
    .gm-clues {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #aaa;
      max-height: 80px;
      overflow-y: auto;
    }
    .gm-clue-item {
      background: rgba(16, 185, 129, 0.15);
      border-left: 2px solid #10b981;
      padding: 6px 10px;
      margin-bottom: 6px;
      border-radius: 0 6px 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gm-clue-text {
      color: #d1fae5;
      flex: 1;
    }
    .gm-clue-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 6px;
      opacity: 0.6;
    }
    .gm-clue-remove:hover {
      opacity: 1;
    }
    .gm-section {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 12px;
    }
    .gm-section-title {
      color: #888;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .gm-thinking {
      color: #e0e0e0;
      font-size: 0.9rem;
      line-height: 1.5;
      max-height: 100px;
      overflow-y: auto;
    }
    .gm-thinking em {
      color: #666;
    }
    .gm-actions {
      color: #e0e0e0;
      font-size: 0.85rem;
    }
    .gm-actions em {
      color: #666;
    }
    .gm-action-item {
      background: rgba(139, 92, 246, 0.2);
      border-left: 3px solid #8b5cf6;
      padding: 8px 10px;
      margin-bottom: 8px;
      border-radius: 0 6px 6px 0;
    }
    .gm-action-target {
      color: #a78bfa;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .gm-action-text {
      color: #d4d4d8;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .gm-history {
      color: #888;
      font-size: 0.8rem;
      max-height: 150px;
      overflow-y: auto;
    }
    .gm-history em {
      color: #555;
    }
    .gm-history-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .gm-history-time {
      color: #666;
      font-size: 0.7rem;
    }
    .gm-history-summary {
      color: #a0a0a0;
    }
    .gm-disabled-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      border-radius: 16px;
    }
    .gm-disabled-overlay.visible {
      display: flex;
    }
    .gm-disabled-message {
      text-align: center;
      color: #888;
    }
    .gm-disabled-message span {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 8px;
    }
    .gm-disabled-message small {
      font-size: 0.8rem;
      color: #666;
    }
    
    /* Responsive: Stack panels on small screens */
    @media (max-width: 900px) {
      #app {
        flex-direction: column;
        align-items: center;
      }
      .gm-panel {
        width: 100%;
        max-width: 480px;
        margin: 0 0 24px 0;
        order: 2;
      }
      .chat-container {
        order: 1;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="chat-container">
      <div class="header">
        <!-- Centered “AI” text within the circle -->
        <svg height="24" width="24" viewBox="0 0 22 22" fill="#fff" style="margin-right:8px">
          <circle cx="11" cy="11" r="12" fill="#222F3D" />
          <text
            x="50%"
            y="50%"
            fill="#fff"
            text-anchor="middle"
            alignment-baseline="middle"
            font-size="12"
            font-family="Inter"
          >AI</text>
        </svg>
        Real-Time Voice Chat
        <select id="characterSelect" class="character-select"></select>
        <span class="character-pill" id="characterBadge"></span>
        <span class="status" id="status"></span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">

        <div class="speed-control">
          <input type="range" id="speedSlider" min="0" max="100" value="0">
          <div class="speed-labels">
            <span>Fast</span>
            <span>Slow</span>
          </div>
        </div>

        <br>

        <button id="startBtn" title="Start voice chat" class="btn start-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 5L18 12L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        
        <button id="stopBtn" title="Stop voice chat" class="btn stop-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="12" height="12" rx="1" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        
        <button id="clearBtn" title="Reset conversation" class="btn reset-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C14.8273 3 17.35 4.30367 19 6.34267" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14.5 6.5L19.5 6.5L19.5 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button> 

        <button id="copyBtn" title="Copy conversation" class="btn copy-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
           <rect x="9" y="9" width="11" height="11" rx="1" stroke="currentColor" stroke-width="2"/>
           <path d="M5 15H4C3.44772 15 3 14.5523 3 14V4C3 3.44772 3.44772 3 4 3H14C14.5523 3 15 3.44772 15 4V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
         </svg>
       </button>

      </div>
      
      <!-- Injection Panel -->
      <div class="inject-panel">
        <input type="text" id="injectInput" placeholder="Inject context (e.g., 'The player found the murder weapon')">
        <button id="injectBtn" title="Inject context" class="btn inject-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Inject
        </button>
      </div>
    </div>
    
    <!-- Game Manager Panel -->
    <div class="gm-panel" id="gmPanel">
      <div class="gm-header">
        <span class="gm-icon">🎮</span>
        <span class="gm-title">Game Manager</span>
        <span class="gm-status" id="gmStatus">● Connecting...</span>
      </div>
      
      <div class="gm-content" id="gmContent">
        <div class="gm-timer-section">
          <div class="gm-timer-label">Next Tick</div>
          <div class="gm-timer" id="gmTimer">--</div>
          <button class="gm-trigger-btn" id="gmTriggerBtn" title="Trigger now">⚡ Trigger</button>
        </div>
        
        <div class="gm-inject-section">
          <div class="gm-section-title">💡 Game Clue</div>
          <div class="gm-inject-row">
            <input type="text" id="gmInjectInput" class="gm-inject-input" placeholder="e.g. 'Player found the murder weapon'" />
            <button id="gmInjectBtn" class="gm-inject-btn">+ Add</button>
          </div>
          <div class="gm-clues" id="gmClues">
            <em>No active clues</em>
          </div>
        </div>
        
        <div class="gm-section">
          <div class="gm-section-title">Last Thinking</div>
          <div class="gm-thinking" id="gmThinking">
            <em>Waiting for first tick...</em>
          </div>
        </div>
        
        <div class="gm-section">
          <div class="gm-section-title">Last Actions</div>
          <div class="gm-actions" id="gmActions">
            <em>No actions yet</em>
          </div>
        </div>
        
        <div class="gm-section">
          <div class="gm-section-title">History</div>
          <div class="gm-history" id="gmHistory">
            <em>No history</em>
          </div>
        </div>
      </div>
      
      <div class="gm-disabled-overlay" id="gmDisabledOverlay">
        <div class="gm-disabled-message">
          <span>Game Manager Disabled</span>
          <small>Enable in game_manager_config.json</small>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
